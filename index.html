<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#121826;--mute:#667085;--line:#e4e8f0;--acc:#1f3f7a;--sh:0 6px 20px rgba(20,40,75,.08)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Roboto,"Segoe UI",Arial,sans-serif}
main{max-width:620px;margin:0 auto;padding:0 16px 120px;animation:f .35s ease}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{margin:0 -16px 18px;padding:calc(26px + env(safe-area-inset-top)) 22px 26px;color:#fff;background:linear-gradient(135deg,#0f1f3d,#1f3f7a 62%,#2f63b5);border-radius:0 0 28px 28px;display:flex;gap:16px;align-items:center;justify-content:space-between}

.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.18);color:#fff;margin-right:6px}
.ring{position:relative;width:78px;height:78px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1rem}

.tl{position:relative;padding-left:22px;border-left:3px solid var(--line);margin:6px 0 6px 8px}
.tl p{margin:0 0 14px;position:relative}.tl p:before{content:"";position:absolute;left:-30px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--c,var(--acc));border:3px solid var(--bg)}

summary{padding:16px 0;font-weight:700;min-height:52px;list-style:none;display:flex;justify-content:space-between}
summary:after{content:"+";color:var(--mute);font-size:1.3rem;line-height:1}details[open] summary:after{content:"–"}

button{font:inherit;font-weight:600;font-size:.92rem;min-height:46px;padding:8px 18px;border-radius:12px;border:0;background:var(--acc);color:var(--bg)}
button.g{background:transparent;border:1px solid var(--line);color:var(--ink)}

input[type=text],input[type=password],input[type=email],textarea{width:100%;margin:6px 0;font:inherit;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px;margin:10px 0}.row>*{flex:1}
ul{padding-left:20px;margin:6px 0}li{margin:6px 0}

.top{padding-top:calc(24px + env(safe-area-inset-top))}
.st{border-radius:14px;padding:12px 14px;margin:10px 0;border:1px solid var(--line);background:var(--card)}.st.cur{border:2px solid var(--k);box-shadow:var(--sh)}.st.lock{opacity:.5}.st label{display:flex;gap:12px;align-items:flex-start}.st input{appearance:none;-webkit-appearance:none;width:26px;height:26px;flex:none;border:2px solid var(--line);border-radius:8px;margin:0;display:grid;place-items:center;background:var(--bg)}.st input:checked{background:var(--k);border-color:var(--k)}.st input:checked::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}.st small{display:block;font-size:.66rem;letter-spacing:.1em;color:var(--mute);font-weight:700}.st.cur small{color:var(--k)}.st.done span{color:var(--mute);text-decoration:line-through}.st ol{margin:10px 0 2px 24px;padding:0}.st ol li{margin:7px 0;font-size:.95rem}

0:["Light day","rest",0,[["Pick next week's post idea",["Read the idea for Saturday on the Plan tab.","Jot any thought about it in Notes."]]]],
1:["Log and plan","log",5,[["Add last week's events to Notes",["Notes tab → type each event with its date → Add note."]],["Check tomorrow's post",["Plan tab → Upcoming posts.","LinkedIn → your photo → Posts → Scheduled: is Tuesday's post there?","If not, write it today and schedule it for Tuesday 9:00 AM."]]]],
3:["Naukri day 1","nk",15,[["Open Naukri",["Naukri app → Profile."]],["Refresh your profile",["Tap the pencil next to Resume headline.","Add or remove one word. Save."]],["Check recommended jobs",["Home → Recommended jobs. Open 5.","Pick 3 that match business operations or project coordination."]],["Apply to 3 jobs",["Tap Apply on each. Answer any questions asked.","Skip roles needing experience you do not have."]],["Log the companies",["Notes tab → type the 3 company names → Add note."]]]],
4:["LinkedIn engage","li",15,[["Open your LinkedIn Home feed",["LinkedIn app → Home."]],["Comment on 3 posts",["Choose posts in supply chain, MBA, chemistry, HR or academia.","Write 2 to 3 sentences that add a point. Avoid 'great post'."]],["Send 5 connection requests",["My Network → find recruiters, alumni, HR.","Connect → Add a note → paste the connection note (LinkedIn tab → Copy)."]],["Reply to messages",["Messaging icon: answer every message."]]]],

function plan0(d){const k=K(d),w=d.getDay(),dom=d.getDate(),uk='u'+d.getFullYear()+'-'+d.getMonth()+':';

t="Write next post";c="wr";m=20;s=pre.concat([["Choose the topic",[topic(n)+" for "+fmt(n)+".","No news this week? This idea works in any week."]],["Write the draft",["Hook line, 2 to 3 short paragraphs, one lesson, a question, 3 to 5 hashtags.","150 to 250 words. Never name clients."]],["Add a photo or video",["Choose a clear image or a short clip."]],["Schedule it",["Tap the clock icon → "+fmt(n)+", 9:00 AM → Schedule."]],["Log it in Notes",["Notes tab: Scheduled the post for "+fmt(n)+"."]]]);if(S.get('d'+k+':'+(pre.length+3))==='1')S.set('sch'+K(n),'1')}

plan(){const W=[["Monday","Log and plan · 5 min","log"],["Tuesday","LinkedIn post day · 20 min","li"],["Wednesday","Naukri day 1 · 15 min","nk"],["Thursday","LinkedIn engage · 15 min","li"],["Friday","Naukri day 2 · 15 min","nk"],["Saturday","Write next post · 20 min","wr"],["Sunday","Light day · 5 min","rest"]],t=K(new Date());

function saveCfg(){const t=document.getElementById('cfg').value,o={},re=/(\w+)\s*:\s*["']([^"']+)["']/g;let m;while(m=re.exec(t))o[m[1]]=m[2];if(!o.apiKey||!o.projectId||!o.appId){alert('Config not recognised. Paste the whole firebaseConfig block.');return}localStorage.setItem('fbcfg',JSON.stringify(o));location.reload()}

function delN(i){const L=JSON.parse(S.get('log')||'[]');L.splice(i,1);S.set('log',JSON.stringify(L));go('notes')}

go('today');
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script><script type="module">
const U='https://www.gstatic.com/firebasejs/10.12.2/';
const setSt=t=>{window.CSTXT=t;const e=document.getElementById('cs');if(e)e.textContent=t};
const cfg=JSON.parse(localStorage.getItem('fbcfg')||'null');
if(!cfg){setSt('Cloud sync is off. Paste your Firebase config below.')}else{try{
const [A,Au,F]=await Promise.all([import(U+'firebase-app.js'),import(U+'firebase-auth.js'),import(U+'firebase-firestore.js')]);
const app=A.initializeApp(cfg),auth=Au.getAuth(app),db=F.getFirestore(app);
const err=e=>setSt(String(e.message||e).replace('Firebase: ',''));
window.cloud={signIn:(e,p)=>Au.signInWithEmailAndPassword(auth,e,p).catch(err),signUp:(e,p)=>Au.createUserWithEmailAndPassword(auth,e,p).catch(err),out:()=>Au.signOut(auth)};
let unsub=null,uid=null,ref=null,tm=null;const dirty=new Set();
const flush=()=>{const up={},t=TS();dirty.forEach(k=>up['k_'+k]={v:localStorage.getItem(k),t:t[k]||Date.now()});dirty.clear();if(ref&&Object.keys(up).length)F.setDoc(ref,up,{merge:true}).catch(err)};
window.onLocalChange=k=>{if(!uid||!SYNC(k))return;dirty.add(k);clearTimeout(tm);tm=setTimeout(flush,600)};
Au.onAuthStateChanged(auth,u=>{if(unsub){unsub();unsub=null}uid=null;if(!u){setSt('Signed out. Sign in to sync.');return}
uid=u.uid;ref=F.doc(db,'users',u.uid,'app','routine');setSt('Connecting as '+u.email+'...');
unsub=F.onSnapshot(ref,snap=>{if(snap.metadata.hasPendingWrites)return;const d=snap.data()||{},t=TS();let ch=false;
for(const f in d){if(f.slice(0,2)!=='k_')continue;const k=f.slice(2),r=d[f];if(SYNC(k)&&r&&r.t>(t[k]||0)){window.applyRemote(k,r.v,r.t);ch=true}}
const up={},t2=TS();for(const k in t2){if(!SYNC(k))continue;const r=d['k_'+k];if(!r||t2[k]>r.t)up['k_'+k]={v:localStorage.getItem(k),t:t2[k]}}
if(Object.keys(up).length)F.setDoc(ref,up,{merge:true}).catch(err);
if(ch&&window.rerender)window.rerender();setSt('Synced as '+u.email+' · '+new Date().toLocaleTimeString())},err)});
}catch(e){setSt('Cloud unavailable (offline?). Your data is saved on this phone and will sync later.')}}
</script>
